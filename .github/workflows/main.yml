name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run Docker Compose integration tests
        working-directory: src/main/js
        run: npm run test:integration

      - name: Run Docker Compose chaos integration tests
        working-directory: src/main/js
        run: npm run test:integration:chaos
